name: Apply mobile polish

on:
  push:
    branches: [design/soft-fox-refresh]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: design/soft-fox-refresh
          fetch-depth: 0

      - name: Apply fixes
        run: python scripts/mobile-polish.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html settings.html
          git commit -m "fix: polish mobile responsive layout"
          git push origin HEAD:design/soft-fox-refresh
