name: Apply soft fox refresh

on:
  push:
    branches:
      - design/soft-fox-refresh

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: design/soft-fox-refresh
          fetch-depth: 0

      - name: Apply visual refresh
        run: python scripts/beautify.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html settings.html README.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: refresh bubble interface [skip ci]"
          git push origin HEAD:design/soft-fox-refresh
