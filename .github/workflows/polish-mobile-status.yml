name: Polish mobile status

on:
  push:
    branches:
      - design/soft-fox-refresh

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: design/soft-fox-refresh
          fetch-depth: 0

      - name: Apply mobile status polish
        run: python scripts/polish_mobile_status.py

      - name: Commit generated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: simplify mobile online status [skip ci]"
          git push origin HEAD:design/soft-fox-refresh
