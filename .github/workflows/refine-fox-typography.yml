name: Refine fox and typography

on:
  push:
    branches:
      - design/soft-fox-refresh

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: design/soft-fox-refresh
          fetch-depth: 0

      - name: Apply refinement
        run: python scripts/refine_fox_typography.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html settings.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: redraw fox and normalize typography [skip ci]"
          git push origin HEAD:design/soft-fox-refresh
